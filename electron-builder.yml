appId: com.chansanya.sltools
productName: SL工具
copyright: Copyright © 2026 chansanya

# 禁用 electron-builder 自带的自动发布(它会因检测到 tag 而索要 GH_TOKEN)。
# Release 由 .github/workflows/release.yml 里的 softprops/action-gh-release 负责创建。
publish: null

directories:
  output: dist
  buildResources: build

# 只打包构建产物 + 运行时所需, 排除源码与 map
files:
  - out/**/*
  - package.json
  - '!**/*.{ts,tsx,md}'
  - '!**/*.map'

asar: true

# Windows: nsis 安装包 + portable 免安装绿色版
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # icon: build/icon.ico  # 图标准备好后启用

# 安装版(NSIS): 可选安装路径, 建快捷方式
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SL工具
  uninstallDisplayName: SL工具
  artifactName: SL-Tools-Setup-${version}.exe

# 免安装绿色版: 单文件 exe, 双击即用, 配置/备份随 exe 携带
portable:
  artifactName: SL-Tools-Portable-${version}.exe
